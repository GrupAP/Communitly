# Variante de docker-compose.yml para un despliegue real (Coolify o
# cualquier servidor remoto). La diferencia con el archivo local es que NO
# monta el codigo como volumen: ese bind mount existe solo para el
# vivo-recarga en desarrollo, y en el servidor de despliegue "./backend" no
# apunta al codigo (apunta a lo que sea que haya en esa ruta relativa dentro
# del checkout que use la herramienta de despliegue), asi que pisaria /app
# con un directorio vacio y el contenedor no podria ni arrancar
# (entrypoint.sh no existiria ahi). Aqui el contenedor usa el codigo tal
# como quedo copiado dentro de la imagen en el build.
#
# "expose" en vez de "ports": el proxy de Coolify llega al contenedor por la
# red interna de Docker, no hace falta (ni conviene) publicar el puerto en
# el host — sobre todo el 80, que el proxy de Coolify necesita para si
# mismo en todas las apps del servidor.
#
# Los dominios de abajo (API_BASE, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS) son
# los del despliegue actual en Coolify, puestos como default para no
# depender de que ese campo este bien cargado en su panel — pero siguen
# siendo variables: si el dominio cambia, se pisan desde Coolify sin tocar
# este archivo.
#
# ALLOWED_HOSTS SIEMPRE debe incluir "localhost": el healthcheck de abajo
# corre DENTRO del contenedor contra "http://localhost:8000", y con
# DEBUG=False Django ya no permite localhost de forma implicita. Sin esto el
# healthcheck nunca pasa (siempre 400), Coolify nunca ve el contenedor
# "healthy" y su proxy responde 503 aunque Django si este arriba y sirviendo
# bien. Si se pisa DJANGO_ALLOWED_HOSTS desde Coolify, hay que mantener
# "localhost" en la lista por la misma razon.
#
# DJANGO_SECRET_KEY nunca lleva default (es un secreto de verdad y no debe
# quedar en un archivo versionado) y usa la sintaxis "${VAR:?mensaje}" en
# vez de dejarlo sin valor: Django no revisa que el SECRET_KEY no este vacio
# al arrancar, asi que un contenedor sin esta variable arrancaria "sano" y
# recien fallaria en el primer request que la necesite (login del admin,
# cualquier POST con CSRF) con un error confuso. Mejor que ni arranque.
# Ademas, el panel de Coolify solo deja editar variables que aparezcan como
# "${VAR}" en el compose; con la sintaxis anterior (solo "DJANGO_SECRET_KEY:"
# sin valor) las mostraba como "gestionadas por el Compose" y no dejaba
# escribir un valor.
services:
  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      SEED_DATA: "${SEED_DATA:-1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Genera uno y ponlo en las variables de entorno de Coolify}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,communitly-api.taws.espol.edu.ec,www.communitly-api.taws.espol.edu.ec}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-https://communitly-api.taws.espol.edu.ec,https://www.communitly-api.taws.espol.edu.ec}"
      DJANGO_SEED_PASSWORD: "${DJANGO_SEED_PASSWORD:-espol2026}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/comunidades/?estudiante_id=1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE: "${API_BASE:-https://communitly-api.taws.espol.edu.ec/api}"
    expose:
      - "80"
    depends_on:
      - backend
